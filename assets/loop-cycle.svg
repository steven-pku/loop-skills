<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="410" viewBox="0 0 1280 410" role="img"><title>From a draft to a reviewable result</title><desc>A bounded review cycle; each skill defines its own checks and stopping rules.</desc><rect width="1280" height="410" rx="24" fill="#f7f4ec"/><g font-family="Arial, sans-serif"><text x="56" y="66" font-size="34" font-weight="700" fill="#192b2a">From a draft to a reviewable result</text><text x="56" y="104" font-size="19" fill="#5c6b67">A bounded review cycle; each skill defines its own checks and stopping rules.</text><rect x="56.0" y="159" width="216.0" height="161" rx="14" fill="white" stroke="#dcded5"/><circle cx="84.0" cy="192" r="13" fill="#39756f"/><text x="84.0" y="197" text-anchor="middle" font-size="15" fill="white">1</text><text x="74.0" y="242" font-size="21" font-weight="700" fill="#192b2a">Frame</text><text x="74.0" y="281" font-size="14" fill="#596a66">Goal, inputs and limits</text><text x="275.0" y="247" font-size="23" fill="#39756f">→</text><rect x="294.0" y="159" width="216.0" height="161" rx="14" fill="white" stroke="#dcded5"/><circle cx="322.0" cy="192" r="13" fill="#39756f"/><text x="322.0" y="197" text-anchor="middle" font-size="15" fill="white">2</text><text x="312.0" y="242" font-size="21" font-weight="700" fill="#192b2a">Draft</text><text x="312.0" y="281" font-size="14" fill="#596a66">Use available evidence</text><text x="513.0" y="247" font-size="23" fill="#39756f">→</text><rect x="532.0" y="159" width="216.0" height="161" rx="14" fill="white" stroke="#dcded5"/><circle cx="560.0" cy="192" r="13" fill="#39756f"/><text x="560.0" y="197" text-anchor="middle" font-size="15" fill="white">3</text><text x="550.0" y="242" font-size="21" font-weight="700" fill="#192b2a">Review</text><text x="550.0" y="281" font-size="14" fill="#596a66">Check explicit criteria</text><text x="751.0" y="247" font-size="23" fill="#39756f">→</text><rect x="770.0" y="159" width="216.0" height="161" rx="14" fill="white" stroke="#dcded5"/><circle cx="798.0" cy="192" r="13" fill="#39756f"/><text x="798.0" y="197" text-anchor="middle" font-size="15" fill="white">4</text><text x="788.0" y="242" font-size="21" font-weight="700" fill="#192b2a">Revise</text><text x="788.0" y="281" font-size="14" fill="#596a66">Within a fixed budget</text><text x="989.0" y="247" font-size="23" fill="#39756f">→</text><rect x="1008.0" y="159" width="216.0" height="161" rx="14" fill="white" stroke="#dcded5"/><circle cx="1036.0" cy="192" r="13" fill="#39756f"/><text x="1036.0" y="197" text-anchor="middle" font-size="15" fill="white">5</text><text x="1026.0" y="242" font-size="21" font-weight="700" fill="#192b2a">Deliver</text><text x="1026.0" y="281" font-size="14" fill="#596a66">Result and open issues</text><text x="56" y="370" font-size="16" fill="#596a66">Clear inputs. Visible limits. Review the result.</text></g></svg>
