name: Validate products
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check identity and resources
        run: python tools/check.py
      - name: Build independent product archives
        run: python tools/package.py --output "${{ runner.temp }}/loop-packages"
